<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f4f9"/>
    </linearGradient>
    <radialGradient id="glowR" cx="86%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#e83437" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#e83437" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowY" cx="6%" cy="94%" r="55%">
      <stop offset="0%" stop-color="#fede59" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#fede59" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#171521" opacity=".06"/>
    </pattern>
    <pattern id="mesh" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M0 0 L160 160 M160 0 L0 160" stroke="#171521" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#glowR)"/>
  <rect width="1600" height="900" fill="url(#glowY)"/>
  <rect width="1600" height="900" fill="url(#mesh)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
</svg>
